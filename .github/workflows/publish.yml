name: publish

# Builds the signed apt repository from the Latest releases in repos.txt and
# publishes it on GitHub Pages; then installs from the published address in
# a clean Ubuntu container to prove it works. Runs on main, by hand (after a
# release), and once a day so a new release appears without anyone pressing
# anything. A pull request only builds and checks the signature.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q apt-utils gnupg
      - name: Fetch the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch.sh debs
      - name: Build and sign
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: bash build_repo.sh debs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  install:
    needs: deploy
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install from the published repository
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt-get update -q && apt-get install -y -q curl ca-certificates
          base=https://usermanegermane.github.io/SecretSpace-apt
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL "$base/secretspace.gpg" -o /etc/apt/keyrings/secretspace.gpg
          echo "deb [signed-by=/etc/apt/keyrings/secretspace.gpg] $base stable main" \
            > /etc/apt/sources.list.d/secretspace.list
          # Pages may take a moment to serve the new files everywhere.
          for try in 1 2 3 4 5; do
            apt-get update -q && apt-get install -y -q secretspace && break
            [ "$try" = 5 ] && exit 1
            sleep 20
          done
          dpkg-query -W secretspace
          test -x /usr/bin/secretspace
